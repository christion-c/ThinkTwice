# Local development services. Start with: docker compose up --detach --wait
name: thinktwice

services:
  postgres:
    image: postgres:18.6-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env (see .env.example)}
      THINKTWICE_OWNER_PASSWORD: ${THINKTWICE_OWNER_PASSWORD:?Set THINKTWICE_OWNER_PASSWORD in .env (see .env.example)}
      THINKTWICE_APP_PASSWORD: ${THINKTWICE_APP_PASSWORD:?Set THINKTWICE_APP_PASSWORD in .env (see .env.example)}
    ports:
      # Only reachable from this computer, never from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./services/api/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
