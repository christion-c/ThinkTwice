name: CI

on:
  push:
    branches: [christion, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        working-directory: services/ml
        run: uv sync --locked
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # Random, single-use passwords for the throwaway CI database, hidden from the logs.
      - name: Generate database passwords
        run: |
          for name in POSTGRES_SUPERUSER_PASSWORD THINKTWICE_OWNER_PASSWORD THINKTWICE_APP_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "${GITHUB_ENV}"
          done

      - name: Start PostgreSQL
        run: docker compose up --detach --wait postgres

      - name: Point tests at the database
        run: |
          echo "TEST_DATABASE_URL=postgresql://thinktwice_app:${THINKTWICE_APP_PASSWORD}@127.0.0.1:5432/thinktwice_test" >> "${GITHUB_ENV}"
          echo "TEST_MIGRATION_DATABASE_URL=postgresql://thinktwice_owner:${THINKTWICE_OWNER_PASSWORD}@127.0.0.1:5432/thinktwice_test" >> "${GITHUB_ENV}"

      - run: pnpm test
      - run: pnpm audit:deps
